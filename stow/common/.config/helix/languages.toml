[language-server.superhtml-lsp]
command = "superhtml"
args = ["lsp"]

[language-server.lua-language-server]
command = "lua-language-server"

[language-server.stylua]
command = "stylua"
args = ["--lsp"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "lua"
language-servers = [
  { name = "lua-language-server", except-features = ["format"] },
  "stylua",
]
auto-format = false

[[language]]
name = "python"
language-servers = ["ruff"]
auto-format = false
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "html"
scope = "source.html"
roots = []
file-types = ["html"]
language-servers = [ "superhtml-lsp" ]
auto-format = true
indent = { tab-width = 4, unit = "    " }
